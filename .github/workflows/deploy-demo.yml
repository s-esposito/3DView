name: Deploy Demo to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: older majors' bundles are built from their release commits below.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        # `npm ci` is reproducible: it installs exactly the committed
        # package-lock.json and fails if it's out of sync (unlike `npm install`,
        # which can mutate the lockfile).
        run: npm ci

      - name: Build demo
        # Build only the shared core (produces out/webview.js) and the demo that
        # copies it — the VS Code extension isn't needed for Pages.
        run: npm run build -w @3dview/core && npm run build -w 3dview-demo

      - name: Prepare Pages artifact
        # Mirror demo/ exactly: index.html at the root references dist/demo.js and
        # dist/webview.js, so the JS must live under _site/dist/ (NOT flattened to
        # the root — that returns the 404 HTML page, which a module script rejects
        # with a "disallowed MIME type (text/html)" error).
        run: |
          mkdir -p _site/dist
          cp demo/index.html _site/
          # Installable web app: manifest, service worker (must sit at the root to
          # control the whole site) and the home-screen icons.
          cp demo/manifest.webmanifest demo/sw.js _site/
          cp -r demo/icons _site/
          cp demo/dist/demo.js _site/dist/
          cp demo/dist/webview.js _site/dist/
          # Sourcemaps are optional — production core builds are minified and
          # may not emit webview.js.map.
          for f in demo/dist/demo.js.map demo/dist/webview.js.map; do
            if [ -f "$f" ]; then cp "$f" _site/dist/; fi
          done
          touch _site/.nojekyll
          # Versioned bundle for pages that embed the viewer (e.g. GenIA's project page): one
          # loading /v<major>/dist/webview.js stays on that major while /dist/ moves on.
          MAJOR=$(node -p "require('./package.json').version.split('.')[0]")
          mkdir -p "_site/v$MAJOR/dist"
          cp demo/dist/webview.js "_site/v$MAJOR/dist/"

      - name: Build older majors' bundles
        # Each older major's last release, rebuilt from its commit (reproducible: npm ci from
        # its own lockfile) and published at /v<major>/dist/webview.js. Add a line per major
        # when the next one ships. A line for the current major is skipped.
        run: |
          MAJOR=$(node -p "require('./package.json').version.split('.')[0]")
          while read -r major ref; do
            if [ -z "$major" ] || [ "$major" = "$MAJOR" ]; then continue; fi
            git worktree add "$RUNNER_TEMP/v$major" "$ref"
            (cd "$RUNNER_TEMP/v$major" && npm ci && npm run build -w @3dview/core)
            mkdir -p "_site/v$major/dist"
            cp "$RUNNER_TEMP/v$major/core/out/webview.js" "_site/v$major/dist/"
          done <<'MAJORS'
          1 32b0158
          MAJORS

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
