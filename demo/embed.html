<!DOCTYPE html>
<!-- 3DView for embedding in a web page: <iframe src=".../v2/embed.html?asset=<url>&preset=presentation">,
     or the embed.js SDK, which makes that iframe. The URL parameters and the messages it takes are
     in docs/embedding.md; dist/embed-frame.js reads them and relays everything to the parent page. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3DView</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      canvas {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
      }
      /* The viewer's status line (loading, errors); it shows and hides it itself. */
      #status {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        max-width: calc(100vw - 32px);
        display: flex;
        align-items: center;
        text-align: center;
        padding: 8px 14px;
        color: #e6e6e6;
        background: rgba(20, 20, 22, 0.72);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.4;
        z-index: 100;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="status" style="display: none"></div>
    <script src="dist/embed-frame.js"></script>
    <script src="dist/webview.js"></script>
  </body>
</html>
